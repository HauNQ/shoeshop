server:
  port: 8081

spring:
  application:
    name: shoeshop-dev
  # 1. Externalize sensitive database credentials
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT}/shoeshop
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driverClassName: org.postgresql.Driver
    # 2. Optimize connection pooling (HikariCP defaults)
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL:20}
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  jpa:
    database: postgresql
    open-in-view: false # 3. Disable OSIV to save connections
    show-sql: true
    hibernate:
      ddl-auto: update # 4. Control table generation safely
    # 5. Fine-tune performance features
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 20 # 6. Fix N+1 select issue
        # 7. Optimize bulk inserts/updates
        order_inserts: true
        order_updates: true
        jdbc:
            batch_size: 30

# 8. Configure clean SQL logging separate from production
logging:
  level:
    org.hibernate.SQL: DEBUG

